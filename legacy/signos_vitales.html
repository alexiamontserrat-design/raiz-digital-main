<div class="header">

<h1>Signos Vitales</h1>

<div class="card">
    <form id="formSignos">
        <input name="presion" placeholder="Presión" />
        <input name="temperatura" placeholder="Temperatura" />
        <input name="frecuencia_cardiaca" placeholder="Frecuencia Cardiaca" />
        <input name="frecuencia_respiratoria" placeholder="Frecuencia Respiratoria" />
        <input name="oxigeno" placeholder="Oxígeno" />
        <input name="glucosa" placeholder="Glucosa" />
        <input name="observaciones" placeholder="Observaciones" />
        <button type="submit">Guardar</button>
    </form>
</div>
<div class="filtro-historial" style="max-width:900px;margin:0 auto 20px auto; display:flex; gap:10px; align-items:center;">
    <label>Desde: <input type="date" id="fecha_inicio"></label>
    <label>Hasta: <input type="date" id="fecha_fin"></label>
    <button id="btnFiltrar">Filtrar</button>
    <button id="btnReset">Reset</button>
</div>

<div class="cardtwo">
    <h3>Historial</h3>
    <table id="tabla">
        <thead>
        <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Presión</th>
            <th>Temp</th>
            <th>Frecuencia Cardiaca</th>
            <th>Frecuencia Respiratoria</th>
            <th>Oxígeno</th>
            <th>Glucosa</th>
            <th>Observaciones</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div style="text-align:center;">
    <a href="/raiz-digital/panel_residente.php" class="back-btn">REGRESAR AL MENÚ</a>
</div>

<script>
document.getElementById("formSignos").addEventListener("submit", function(e){
    e.preventDefault();
    const formData = new FormData(this);
    fetch("signos_vitales.php", { method: "POST", body: formData })
        .then(res => res.json())
        .then(data => {
            alert("Guardado");
            cargarHistorial();
        });
});

function cargarHistorial(fechaInicio = '', fechaFin = '') {
    let url = "signos_vitales.php";
    if(fechaInicio && fechaFin){
        url += `?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`;
    }

    fetch(url)
        .then(res => res.json())
        .then(data => {
            const tbody = document.querySelector("#tabla tbody");
            tbody.innerHTML = "";
            data.forEach(row => {
                tbody.innerHTML += `
                    <tr>
                        <td>${row.fecha}</td>
                        <td>${row.hora}</td>
                        <td>${row.presion}</td>
                        <td>${row.temperatura}</td>
                        <td>${row.frecuencia_cardiaca}</td>
                        <td>${row.frecuencia_respiratoria}</td>
                        <td>${row.oxigeno}</td>
                        <td>${row.glucosa}</td>
                        <td>${row.observaciones}</td>
                    </tr>
                `;
            });
        });
}

// Eventos de los botones
document.getElementById("btnFiltrar").addEventListener("click", () => {
    const inicio = document.getElementById("fecha_inicio").value;
    const fin = document.getElementById("fecha_fin").value;
    if(inicio && fin){
        cargarHistorial(inicio, fin);
    } else {
        alert("Selecciona un rango de fechas válido");
    }
});

document.getElementById("btnReset").addEventListener("click", () => {
    document.getElementById("fecha_inicio").value = '';
    document.getElementById("fecha_fin").value = '';
    cargarHistorial();
});
</script>
